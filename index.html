  <!-- Subject View (documents + attendance) -->
  <div id="subjectViewModal" class="modal hidden">
    <div class="modal-card wide">
      <button class="close" data-close="subjectViewModal">×</button>
      <div id="subjectHeader"></div>

      <!-- Attendance Section -->
      <div class="attendance-section">
        <h3>📋 Take Attendance</h3>
        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:end;">
          <div style="min-width:150px;">
            <label>Date</label>
            <input type="date" id="attendanceDate" />
          </div>
          <div style="min-width:150px;">
            <label>Total Students</label>
            <input type="number" id="attendanceTotal" min="1" max="200" placeholder="e.g. 60" />
          </div>
          <button id="generateGridBtn" class="secondary" style="margin-top:22px;">📊 Generate Grid</button>
        </div>
        <p id="attendanceMessage" class="message"></p>

        <!-- Roll Number Grid -->
        <div id="rollGrid" style="margin-top:12px; display:none;">
          <p class="muted small">Click a roll number to mark <strong>absent</strong> (red). Click again to mark present.</p>
          <div id="rollGridContainer" style="display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;"></div>
          <button id="saveAttendanceBtn" class="primary">💾 Save Attendance</button>
          <button id="clearGridBtn" class="secondary" style="margin-left:8px;">🔄 Reset Grid</button>
        </div>
      </div>

      <!-- Attendance History -->
      <div style="margin:16px 0;">
        <h3>📜 Attendance History</h3>
        <div id="attendanceList" style="max-height:200px; overflow-y:auto;">
          <p class="muted">Loading...</p>
        </div>
      </div>

      <!-- Document Upload -->
      <div class="upload-box">
        <h3>📤 Upload Academic Document</h3>
        <label>Document Category</label>
        <select id="documentType">
          <option>Syllabus</option>
          <option>Lesson Plan</option>
          <option>Course Plan</option>
          <option>Student List</option>
          <option>Attendance</option>
          <option>CIE-I</option>
          <option>CIE-II</option>
          <option>CIE-III</option>
          <option>Question Paper</option>
          <option>Evaluated Answer Scripts</option>
          <option>CIE Result</option>
          <option>CO-PO-PSO Mapping</option>
          <option>CO Attainment</option>
          <option>Result Analysis</option>
          <option>Student Feedback</option>
          <option>Action Taken Report</option>
          <option>Course File</option>
          <option>Activity Photographs</option>
          <option>Other</option>
        </select>
        <label>File</label>
        <input id="fileInput" type="file" />
        <button id="uploadBtn" class="primary" style="margin-top:12px;">⬆ Upload File</button>
        <p class="muted small" style="margin-top:6px;">Maximum file size: 50 MB (current bucket limit).</p>
        <p id="uploadMessage" class="message"></p>
      </div>
      <h3 style="margin-top:8px;">📄 Documents</h3>
      <div id="documentsList"></div>
    </div>
  </div>
